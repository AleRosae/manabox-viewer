services:
  manabox-viewer:
    build: .
    image: manabox-viewer
    container_name: manabox-viewer
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/data
    environment:
      # Fallback conversion for cards without a EUR price on Scryfall.
      - USD_TO_EUR=0.92
    restart: unless-stopped
